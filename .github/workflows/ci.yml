name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate Iranian deployment scripts
        run: |
          bash -n deploy/bootstrap-supabase.sh
          bash -n deploy/export-cloud.sh
          node --check deploy/verify-public.mjs

      - name: Validate Iranian web Docker Compose
        env:
          VITE_SUPABASE_URL: https://api.event.ayenehouse.ir
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: docker compose -f deploy/docker-compose.web.yml config -q

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayene-dist
          path: dist
          if-no-files-found: error
