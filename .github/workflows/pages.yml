name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin exact Figma hero and logo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images

          if [ ! -s public/images/hero-figma-exact.png ] || [ ! -s public/images/ayene-logo-figma-exact.png ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://www.figma.com/api/mcp/asset/173913b4-098a-494a-9ca8-536cfb42c7fb.png" \
              --output public/images/hero-figma-exact.png

            curl --fail --location --retry 3 --retry-delay 2 \
              "https://www.figma.com/api/mcp/asset/10d606d6-e60d-4f51-bb6f-7debc07f1dd9.png" \
              --output public/images/ayene-logo-figma-exact.png

            test -s public/images/hero-figma-exact.png
            test -s public/images/ayene-logo-figma-exact.png

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/images/hero-figma-exact.png public/images/ayene-logo-figma-exact.png
            git diff --cached --quiet || git commit -m "assets: pin exact Figma hero and logo"
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: https://hchtvcrogohhkhfxkfvd.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_W2bB-nd4IudheqSHz_5ZIQ_16aChA00
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
